[project]
name = "umbracrawl"
version = "1.0.0"
description = "Local-first stealth research crawler. SQLite-backed, 4 workers, uncapped deep crawl."
requires-python = ">=3.10"
dependencies = ["curl_cffi>=0.7", "lxml>=4.9", "pyyaml>=6", "cssselect>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["umbracrawl*"]
